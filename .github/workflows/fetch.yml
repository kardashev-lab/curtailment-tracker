name: Daily curtailment fetch

on:
  schedule:
    # 08:00 UTC = midnight PT (after CAISO finalizes previous day data)
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      fetch_date:
        description: "Specific date to fetch (YYYY-MM-DD). Leave blank for yesterday."
        required: false
      backfill_days:
        description: "Number of days to backfill (overrides BACKFILL_DAYS)."
        required: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r services/fetcher/requirements.txt

      - name: Run fetcher
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FETCH_DATE: ${{ github.event.inputs.fetch_date }}
          BACKFILL_DAYS: ${{ github.event.inputs.backfill_days || '2' }}
        run: python services/fetcher/fetch.py
